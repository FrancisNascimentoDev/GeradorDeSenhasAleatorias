<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Título dentro do container -->
        <h1>Gerador de Senha Aleatória</h1>

        <!-- Container de opções -->
        <div class="options-container">
            <div class="option">
                <label for="password-length">Comprimento da Senha:</label>
                <input type="number" id="password-length" min="6" max="20" value="12">
            </div>

            <div class="option">
                <label for="include-numbers">Incluir Números:</label>
                <input type="checkbox" id="include-numbers" checked>
            </div>

            <div class="option">
                <label for="include-special">Incluir Caracteres Especiais:</label>
                <input type="checkbox" id="include-special" checked>
            </div>

            <div class="option">
                <label for="include-uppercase">Incluir Letras Maiúsculas:</label>
                <input type="checkbox" id="include-uppercase" checked>
            </div>

            <div class="option">
                <label for="include-lowercase">Incluir Letras Minúsculas:</label>
                <input type="checkbox" id="include-lowercase" checked>
            </div>

            <div class="option">
                <label for="exclude-ambiguous">Excluir Caracteres Ambíguos:</label>
                <input type="checkbox" id="exclude-ambiguous">
            </div>

            <div class="option">
                <label for="custom-symbols">Símbolos Personalizados:</label>
                <input type="text" id="custom-symbols" placeholder="Exemplo: #$&*" />
            </div>

            <button onclick="generatePassword()">Gerar Senha</button>
        </div>

        <!-- Campo para exibir a senha gerada -->
        <div class="password-box">
            <input type="text" id="password" readonly>
            <p id="password-strength"></p>
        </div>
    </div>

    <!-- Botão flutuante -->
    <button id="theme-toggle" onclick="toggleTheme()">🌙</button>

    <script src="script.js"></script>
</body>
</html>
